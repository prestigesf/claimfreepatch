<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free custom patch — DeadlineSF</title>
<meta name="description" content="Free custom Cal. Civ. Code § 3111 training-data disclosure, built in your browser.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://claimfreepatch.netlify.app/">
<style>
:root{--bg:#050505;--ink:#f2f2f2;--muted:#888;--line:#1a1a1a;--red:#ff3b2f;--green:#46e6a0;--warn:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit}a:hover{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top a{color:var(--muted);text-decoration:none}
.mark{color:var(--ink)}.mark span{color:var(--red)}
main{flex:1;padding:48px 20px 64px;max-width:620px;margin:0 auto;width:100%}
h1{font-size:clamp(1.7rem,5vw,2.25rem);line-height:1.1;font-weight:700;letter-spacing:-.03em;margin-bottom:8px;text-align:center}
.cite{text-align:center;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:28px}
.row{display:flex;gap:10px;margin-bottom:10px}.row input{flex:1}#contact{margin-bottom:10px}
input,textarea,select{width:100%;background:#0d0d0d;border:1px solid #222;border-radius:6px;color:var(--ink);font:14px/1.4 inherit;padding:10px;min-height:44px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.seg label:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
.scan{display:block;border:1px dashed #333;border-radius:8px;padding:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;margin:14px 0 20px}
.scan input{display:none}
#scanned,.ev,#logo-status{display:block;margin-top:6px;font:11px/1.3 ui-monospace,Menlo,monospace;color:var(--green);word-break:break-all}
#logo-status{color:var(--warn)}
.f{display:block;margin-bottom:14px}
.f span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}.f i{font-style:normal;color:#888;font-family:ui-monospace,Menlo,monospace}
fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;margin:0 0 16px}
legend{font-size:12px;color:var(--muted);padding:0 6px}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-height:44px;padding:10px 8px;border:1px solid #222;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
.seg input{position:absolute;opacity:0;width:1px;height:1px;clip:rect(0 0 0 0);overflow:hidden}
.seg label:has(input:checked){border-color:var(--ink);color:var(--ink);background:#111}
.swatch{display:grid;grid-template-columns:1fr 44px minmax(0,7.6rem);gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.swatch input[type=color]{width:44px;height:44px;min-height:44px;padding:0;border:1px solid #222;background:transparent;cursor:pointer}
.fonts{display:grid;gap:10px;margin:4px 0 12px}
.fonts label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
#css-brand{min-height:88px;font:12px/1.45 ui-monospace,Menlo,monospace;margin-top:4px}
#contrast{min-height:1.2em;margin:0 0 12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--warn);text-align:center}
.preview-label{display:block;font-size:12px;color:var(--muted);margin:4px 0 8px}
#preview{border:1px solid var(--line);border-radius:10px;padding:28px 20px;overflow:auto;background:#f7f6f3;color:#161616;font-family:ui-sans-serif,system-ui,sans-serif;margin-bottom:16px;min-height:8rem}
.actions{display:flex;gap:10px;margin-top:8px}
.cta,.ghost{appearance:none;border:0;cursor:pointer;font-weight:700;font-size:1.25rem;padding:16px 24px;border-radius:8px;flex:1;min-height:48px}
.cta{background:var(--red);color:#fff}
.cta:hover{background:#e4332a}
.ghost{background:transparent;color:var(--ink);border:1px solid #333}
.ghost:hover{border-color:var(--ink)}
#status{text-align:center;margin-top:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted)}
.next{margin-top:22px;padding-top:16px;border-top:1px solid #222;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.next p{margin:0;flex:1;min-width:180px;font-size:14px;color:var(--muted)}.next a{flex:0 0 auto;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.note{margin-top:22px;font-size:12px;color:#888;text-align:center}
footer{border-top:1px solid var(--line);padding:16px 24px;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#888;text-align:center}
footer a{color:#b0b0b0;text-decoration:none}
@media (min-width:560px){.fonts{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.row,.actions{flex-direction:column}.top{padding:16px}.swatch{grid-template-columns:1fr 44px minmax(0,6.5rem)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<script src="vendor/qrcode-generator/qrcode.js" defer></script>
<script src="generator.js" defer></script>
</head>
<body>
  <div class="top">
    <div class="mark">//DEADLINE<span>SF</span></div>
    <a href="https://deadlinesf.net">deadlinesf.net</a>
  </div>
  <main>
    <h1>Free custom § 3111 patch</h1>
    <p class="cite">Cal. Civ. Code § 3111(a)(1)–(12)</p>
    <div class="row"><input id="dev" placeholder="Company" aria-label="Company" autocomplete="organization"><input id="sys" placeholder="AI system" aria-label="AI system"></div>
    <input id="contact" placeholder="Contact" aria-label="Contact" autocomplete="off">
    <label class="scan">Find evidence in a folder — stays on this device<input type="file" id="folder" webkitdirectory multiple><small id="scanned"></small></label>
    <form id="fields"></form>
    <fieldset>
      <legend>Output</legend>
      <div class="seg" role="radiogroup" aria-label="Output">
        <label><input type="radio" name="mode" value="embed" checked> Embed in my site</label>
        <label><input type="radio" name="mode" value="standalone"> Standalone page</label>
      </div>
    </fieldset>
    <fieldset id="theme" hidden>
      <legend>Brand</legend>
      <div class="swatch"><label id="lbl-primary" for="c-primary">Primary</label><input type="color" id="c-primary" value="#111111" aria-labelledby="lbl-primary"><input type="text" id="c-primary-hex" value="#111111" aria-label="Primary hex" spellcheck="false" autocomplete="off" maxlength="7"></div>
      <div class="swatch"><label id="lbl-text" for="c-text">Text</label><input type="color" id="c-text" value="#111111" aria-labelledby="lbl-text"><input type="text" id="c-text-hex" value="#111111" aria-label="Text hex" spellcheck="false" autocomplete="off" maxlength="7"></div>
      <div class="swatch"><label id="lbl-bg" for="c-bg">Background</label><input type="color" id="c-bg" value="#ffffff" aria-labelledby="lbl-bg"><input type="text" id="c-bg-hex" value="#ffffff" aria-label="Background hex" spellcheck="false" autocomplete="off" maxlength="7"></div>
      <div class="swatch"><label id="lbl-accent" for="c-accent">Accent</label><input type="color" id="c-accent" value="#444444" aria-labelledby="lbl-accent"><input type="text" id="c-accent-hex" value="#444444" aria-label="Accent hex" spellcheck="false" autocomplete="off" maxlength="7"></div>
      <div class="fonts">
        <label>Heading
          <select id="font-heading" aria-label="Heading font">
            <option value="system-sans" selected>System sans</option>
            <option value="system-serif">System serif</option>
            <option value="georgia">Georgia</option>
            <option value="times">Times</option>
            <option value="system-mono">System mono</option>
          </select>
          <input id="font-heading-custom" placeholder="Font name" aria-label="Heading font name" autocomplete="off" spellcheck="false">
        </label>
        <label>Body
          <select id="font-body" aria-label="Body font">
            <option value="system-sans" selected>System sans</option>
            <option value="system-serif">System serif</option>
            <option value="georgia">Georgia</option>
            <option value="times">Times</option>
            <option value="system-mono">System mono</option>
          </select>
          <input id="font-body-custom" placeholder="Font name" aria-label="Body font name" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <label for="css-brand">CSS</label>
      <textarea id="css-brand" placeholder="--primary: #123456" aria-label="CSS variables or hex codes" spellcheck="false"></textarea>
    </fieldset>
    <label class="scan">Logo<input type="file" id="logo" accept="image/png,image/jpeg,image/webp,image/gif"><small id="logo-status"></small></label>
    <p id="contrast" role="status" aria-live="polite"></p>
    <span class="preview-label" id="preview-label">Preview</span>
    <div id="preview" aria-labelledby="preview-label"></div>
    <div class="actions">
      <button class="ghost" id="copy" type="button">Copy</button>
      <button class="cta" id="make" type="button">Download</button>
    </div>
    <p id="status"></p>
    <div class="next">
      <p>Next: we check the whole repository.</p>
      <a class="ghost" id="scan-cta" href="https://deadlinesf.net/checkout?pkg=scan_3500">Scan · $3,500</a>
    </div>
    <p class="note">Nothing uploaded. Not legal advice.</p>
  </main>
  <footer>DeadlineSF · <a href="https://deadlinesf.net">deadlinesf.net</a></footer>
</body>
</html>
