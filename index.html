<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free custom patch — DeadlineSF</title>
<meta name="description" content="Free custom Cal. Civ. Code § 3111 training-data disclosure, built in your browser.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://claimfreepatch.netlify.app/">
<style>
:root{--bg:#050505;--ink:#f2f2f2;--muted:#888;--line:#1a1a1a;--red:#ff3b2f;--green:#46e6a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit}a:hover{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top a{color:var(--muted);text-decoration:none}
.mark{color:var(--ink)}.mark span{color:var(--red)}
main{flex:1;padding:48px 20px 64px;max-width:620px;margin:0 auto;width:100%}
h1{font-size:clamp(1.7rem,5vw,2.25rem);line-height:1.1;font-weight:700;letter-spacing:-.03em;margin-bottom:8px;text-align:center}
.cite{text-align:center;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);margin-bottom:28px}
.row{display:flex;gap:10px;margin-bottom:10px}.row input{flex:1}
input,textarea{width:100%;background:#0d0d0d;border:1px solid #222;border-radius:6px;color:var(--ink);font:14px/1.4 inherit;padding:10px}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
.scan{display:block;border:1px dashed #333;border-radius:8px;padding:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;margin:14px 0 20px}
.scan input{display:none}
#scanned{display:block;margin-top:6px;font:11px/1.3 ui-monospace,Menlo,monospace;color:var(--green)}
.f{display:block;margin-bottom:14px}
.f span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}.f i{font-style:normal;color:#555;font-family:ui-monospace,Menlo,monospace}
.ev{display:block;font:11px/1.3 ui-monospace,Menlo,monospace;color:var(--green);margin-top:3px;word-break:break-all}
.cta{appearance:none;border:0;cursor:pointer;background:var(--red);color:#fff;font-weight:700;font-size:1rem;padding:16px 32px;border-radius:8px;width:100%;margin-top:8px}
.cta:hover{background:#ff5248}
#status{text-align:center;margin-top:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted)}
.note{margin-top:22px;font-size:12px;color:#666;text-align:center}
footer{border-top:1px solid var(--line);padding:16px 24px;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#333;text-align:center}
footer a{color:#555;text-decoration:none}
</style>
<script src="generator.js" defer></script>
</head>
<body>
  <div class="top">
    <div class="mark">//DEADLINE<span>SF</span></div>
    <a href="https://deadlinesf.net">deadlinesf.net</a>
  </div>
  <main>
    <h1>Free custom § 3111 patch</h1>
    <p class="cite">Cal. Civ. Code § 3111(a)(1)–(12)</p>
    <div class="row"><input id="dev" placeholder="Company" autocomplete="organization"><input id="sys" placeholder="AI system"></div>
    <input id="contact" placeholder="Contact">
    <label class="scan">Scan code folder — stays on this device<input type="file" id="folder" webkitdirectory multiple><small id="scanned"></small></label>
    <form id="fields"></form>
    <button class="cta" id="make" type="button">Download custom patch</button>
    <p id="status"></p>
    <p class="note">Nothing uploaded. Not legal advice.</p>
  </main>
  <footer>DeadlineSF · <a href="https://deadlinesf.net">deadlinesf.net</a></footer>
</body>
</html>
